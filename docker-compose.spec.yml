name: nccl-parents-test

services:
  db:
    image: postgres:17
    ports:
      - "11002:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nccl-parents-db-ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nccl-parents-db-ci"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "11001:8080"
    environment:
      NODE_ENV: production
      NCCL_ENVIRONMENT: ci
      NCCL_API_URL: http://api:11001
      NCCL_APP_URL: http://app:11000
      DATABASE_URL: postgresql://postgres:postgres@db:11002/nccl-parents-db-ci
      GCP_CLOUD_STORAGE_BUCKET: nccl-parents-resources-test
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      SUPER_USER_EMAIL: ${SUPER_USER_EMAIL}
      SUPER_USER_PASSWORD: ${SUPER_USER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    ports:
      - "11000:8080"
    environment:
      NODE_ENV: production
      NCCL_ENVIRONMENT: ci
      NCCL_API_URL: http://api:11001
      NCCL_APP_URL: http://app:11000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nccl-parents-db-ci
      GCP_CLOUD_STORAGE_BUCKET: nccl-parents-resources-test
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      SUPER_USER_EMAIL: ${SUPER_USER_EMAIL}
      SUPER_USER_PASSWORD: ${SUPER_USER_PASSWORD}
    depends_on:
      api:
        condition: service_healthy
