name: nccl-parents-test

services:
  db:
    image: postgres:17
    ports:
      - "${POSTGRES_PORT:?error}:5432"
    env_file:
      - ./.env.spec
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:?error}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "${API_PORT:?error}:8080"
    env_file:
      - ./.env.spec
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    ports:
      - "${APP_PORT:?error}:8080"
    env_file:
      - ./.env.spec
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
