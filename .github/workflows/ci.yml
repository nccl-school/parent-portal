name: CI - Build & Test

on:
  pull_request:
    branches:
      - dev

jobs:
  test-and-build:
    name: CI - Build & test
    runs-on: ubuntu-latest
    environment:
      name: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The .env and .env.spec needs to be created for docker compose
      # so that it can load to the proper variables when it creates the
      # docker services
      - name: Create .env file
        run: |
          touch .env
          touch .env.spec 
          echo POSTGRES_DB=${{ vars.POSTGRES_DB }} >> .env
          echo POSTGRES_USER=${{ vars.POSTGRES_USER }} >> .env
          echo POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} >> .env
          echo POSTGRES_HOST=${{ vars.POSTGRES_HOST }} >> .env
          echo POSTGRES_PORT=${{ vars.POSTGRES_PORT }} >> .env
          echo DATABASE_URL=${{ secrets.DATABASE_URL }} >> .env
          echo AUTH_TOKEN=${{ secrets.AUTH_TOKEN }} >> .env
          echo NCCL_API_URL=${{ vars.NCCL_API_URL }} >> .env
          echo VITE_NCCL_API_URL=${{ vars.NCCL_API_URL }} >> .env
          echo NCCL_APP_URL=${{ vars.NCCL_APP_URL }} >> .env
          echo GOOGLE_CALENDAR_API_KEY=${{ secrets.GOOGLE_CALENDAR_API_KEY }} >> .env
          echo GOOGLE_CALENDAR_ID_NCCL_PUBLIC=${{ secrets.GOOGLE_CALENDAR_ID_NCCL_PUBLIC }} >> .env

      - name: Set node.js version
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Enable corepack # Ensures the correct version of yarn is used
        run: corepack enable

      - name: Set Up node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate env vars
        run: yarn env:validate

      - name: Generate Prisma client
        working-directory: packages/api
        env:
          NODE_ENV: test
        run: npx prisma generate

      - name: Build project
        run: yarn build
        env:
          NCCL_API_URL: ${{ vars.NCCL_API_URL }}
          TURBO_TOKEN: ${{secrets.TURBO_TOKEN}}
          TURBO_TEAM: ${{secrets.TURBO_TEAM_ID}}

      - name: Install production dependencies
        run: yarn workspaces focus --production --all

      - name: Start containers
        run: docker compose -f docker-compose.spec.yml --progress plain up -d

      - name: Pause for containers
        run: |
          docker compose ps

      - name: Reset and seed DB
        working-directory: packages/api
        env:
          NODE_ENV: test:host
        run: |
          npx prisma migrate reset --force --skip-generate

      - name: Run API tests
        run: npx playwright test
