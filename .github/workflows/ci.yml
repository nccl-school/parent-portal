name: CI - Build & Test

on:
  pull_request:
    branches:
      - dev

env:
  # CI
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM_ID: ${{ secrets.TURBO_TEAM_ID }}
  # Runtime
  NODE_ENV: ${{ vars.NODE_ENV }}
  NCCL_ENVIRONMENT: ${{ vars.NCCL_ENVIRONMENT }}
  NCCL_APP_URL: ${{ vars.NCCL_APP_URL }}
  NCCL_API_URL: ${{ vars.NCCL_API_URL }}
  GCP_CLOUD_STORAGE_BUCKET: ${{ vars.GCP_CLOUD_STORAGE_BUCKET }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  SUPER_USER_PASSWORD: ${{ secrets.SUPER_USER_PASSWORD }}
  SUPER_USER_EMAIL: ${{ secrets.SUPER_USER_EMAIL }}

jobs:
  ci:
    name: CI - Build & test
    runs-on: ubuntu-latest
    environment:
      name: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set node.js version
        id: node_version
        shell: bash
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Enable corepack # Ensures the correct version of yarn is used
        shell: bash
        run: corepack enable

      - name: Set Up node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        shell: bash
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM_ID: ${{ secrets.TURBO_TEAM_ID }}

      - name: Install production dependencies
        run: yarn workspaces focus --production --all

      - name: Start containers
        run: docker compose -f docker-compose.spec.yml --progress plain up -d

      - name: Pause for containers
        run: |
          docker compose ps

      - name: Reset and seed DB
        working-directory: packages/api
        run: yarn prisma migrate reset --force --skip-generate

      - name: Run API tests
        run: yarn playwright test
