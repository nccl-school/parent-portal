name: CI - Build & Test

on:
  pull_request:
    branches:
      - dev

jobs:
  ci:
    name: CI - Build & test
    runs-on: ubuntu-latest
    environment:
      name: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: ./.github/actions/setup-and-install

      - name: Start containers
        run: docker compose -f=docker-compose.spec.yml --env-file=.env --progress plain up -d

      - name: Pause for containers
        run: |
          docker compose wait

      - name: Reset and seed DB
        working-directory: packages/api
        run: docker compose -f=docker-compose.spec.yml --env-file=.env exec -T api yarn prisma migrate reset --force --skip-generate

      - name: Run API tests
        run: yarn playwright test
