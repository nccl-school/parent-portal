name: CD

on:
  push:
    branches:
      - dev
      - feat/db-and-api

jobs:
  db_changes:
    name: DB - Check for new migrations
    runs-on: ubuntu-latest
    outputs:
      db_has_changed: ${{ steps.db.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch comparison branch
        run: git fetch origin dev

      - id: db
        name: Check if Prisma Migrations Have Changed
        working-directory: packages/api
        run: |
          echo "🔍 Checking for changes to 'prisma/migrations/' between this commit and origin/dev"
          CHANGED_FILES=$(git diff --name-only origin/dev...HEAD)
          echo

          echo "📄 Files changed in commit range:"
          echo "$CHANGED_FILES"
          echo

          if echo "$CHANGED_FILES" | grep '^prisma/migrations/'; then
            echo "✅ Detected changes in 'prisma/migrations/' — running DB migration."
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No changes to 'prisma/migrations/' — skipping DB migration."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
  db_deploy:
    name: DB - Run migrations
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    needs: db_changes
    if: needs.db_changes.outputs.db_has_changed == 'true'
    outputs:
      ran: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Node.js Version
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Enable Corepack # Ensures the correct version of yarn is used
        run: corepack enable

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Prisma Migrate Deploy
        working-directory: packages/api
        run: yarn prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Generate Prisma Client
        working-directory: packages/api
        run: yarn prisma generate

      - name: Seed
        working-directory: packages/api
        run: yarn prisma db seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  debug_outputs:
    runs-on: ubuntu-latest
    needs: [db_changes, db_deploy]
    if: always()
    steps:
      - name: Print values for debug
        run: |
          echo "db_changes.outputs.db_has_changed: ${{ needs.db_changes.outputs.db_has_changed }}"
          echo "db_deploy.result: ${{ needs.db_deploy.result }}"
          echo  ${{needs.db_deploy.result }} == 'success' || ${{ needs.db_changes.outputs.db_has_changed }} == 'false'

  build:
    name: Build & Deploy App and API
    runs-on: ubuntu-latest
    needs: [db_changes, db_deploy]
    if: ${{ needs.db_deploy.result == 'success' || needs.db_changes.outputs.db_has_changed == 'false' }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    steps:
      - name: Deploy
        run: |
          echo "Deploying branch: ${{ github.ref_name }}"
          echo "To environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Node.js Version
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Enable Corepack # Ensures the correct version of yarn is used
        run: corepack enable

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Generate Prisma Client
        working-directory: packages/api
        run: yarn prisma generate

      - name: Build Monorepo
        run: yarn build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          TURBO_TOKEN: ${{secrets.TURBO_TOKEN}}
          TURBO_TEAM: ${{secrets.TURBO_TEAM_ID}}

      - name: GCP - Authenticate
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: GCP - Setup
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Define Images
        run: |
          echo "DOCKER_IMAGE_API=gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ vars.CLOUD_RUN_API_SERVICE_NAME }}" >> $GITHUB_ENV
          echo "DOCKER_IMAGE_APP=gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ vars.CLOUD_RUN_APP_SERVICE_NAME }}" >> $GITHUB_ENV

      - name: API - Build & push image to GCR
        working-directory: packages/api
        run: |
          docker build . -t $DOCKER_IMAGE_API
          docker push $DOCKER_IMAGE_API

      - name: API - Deploy image to Cloud Run
        run: |
          gcloud run deploy ${{vars.CLOUD_RUN_API_SERVICE_NAME}} \
            --image $DOCKER_IMAGE_API \
            --platform managed \
            --allow-unauthenticated \
            --region us-east4 \
            --set-env-vars NODE_ENV=production,\
          NCCL_APP_URL=${{ vars.NCCL_APP_URL }},\
          NCCL_API_URL=${{ vars.NCCL_API_URL }},\
          DATABASE_URL=${{ secrets.DATABASE_URL }},\
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }},\
          CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }},\
          CLERK_WEBHOOK_SIGNING_SECRET=${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }},\
          GOOGLE_CALENDAR_API_KEY=${{ secrets.GOOGLE_CALENDAR_API_KEY }},\
          GOOGLE_CALENDAR_ID_NCCL_PUBLIC=${{ secrets.GOOGLE_CALENDAR_ID_NCCL_PUBLIC }}

      # - name: GCP - Build | App
      #   working-directory: packages/app
