name: CD

# on:
#   push:
#     branches:
#       - dev

on:
  pull_request:
    branches:
      - dev

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    outputs:
      api_image_name: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_GAR_REPO_API }}/${{ vars.CLOUD_RUN_API_SERVICE_NAME }}
      app_image_name: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_GAR_REPO_APP }}/${{ vars.CLOUD_RUN_APP_SERVICE_NAME }}
      comparison_branch: ${{ github.ref_name == 'main' && 'main' || 'dev' }}
      environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      # node_version: ${{ steps.db.outputs.node_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set Up node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: "Install dependencies"
        run: yarn install --immutable

      - name: Validate environment
        run: |
          yarn turbo --filter @nccl/env
          node scripts/validate.cd.js
        env:
          # CI
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM_ID: ${{ secrets.TURBO_TEAM_ID }}
          # CD
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_APP_SERVICE_NAME: ${{ vars.CLOUD_RUN_APP_SERVICE_NAME }}
          CLOUD_RUN_API_SERVICE_NAME: ${{ vars.CLOUD_RUN_API_SERVICE_NAME }}
          GCP_GAR_REPO_APP: ${{ vars.GCP_GAR_REPO_APP }}
          GCP_GAR_REPO_API: ${{ vars.GCP_GAR_REPO_API }}
          # Runtime
          NODE_ENV: production
          NCCL_ENVIRONMENT: ${{ vars.NCCL_ENVIRONMENT }}
          NCCL_APP_URL: ${{ vars.NCCL_APP_URL }}
          NCCL_API_URL: ${{ vars.NCCL_API_URL }}
          GCP_CLOUD_STORAGE_BUCKET: ${{ vars.GCP_CLOUD_STORAGE_BUCKET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPER_USER_PASSWORD: ${{ secrets.SUPER_USER_PASSWORD }}
          SUPER_USER_EMAIL: ${{ secrets.SUPER_USER_EMAIL }}

  db_check:
    name: Check DB
    runs-on: ubuntu-latest
    needs: [setup]
    outputs:
      should_migrate: ${{ steps.db.outputs.should_migrate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch comparison branch
        run: git fetch origin ${{ needs.setup.outputs.comparison_branch }}

      - id: db
        name: Check if Prisma Migrations Have Changed
        working-directory: packages/api
        run: |
          echo "🔍 Checking for changes to 'prisma/migrations/' between this commit and origin/${{ needs.setup.outputs.comparison_branch }}"
          CHANGED_FILES=$(git diff --name-only origin/${{ needs.setup.outputs.comparison_branch }}...HEAD)
          echo

          echo "📄 Files changed in commit range:"
          echo "$CHANGED_FILES"
          echo

          if echo "$CHANGED_FILES" | grep '^prisma/migrations/'; then
            echo "✅ Detected changes in 'prisma/migrations/' — running DB migration."
            echo "should_migrate=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No changes to 'prisma/migrations/' — skipping DB migration."
            echo "should_migrate=false" >> $GITHUB_OUTPUT
          fi
  db_migrate:
    name: Migrate DB
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    needs: [setup, db_check]
    if: needs.db_check.outputs.should_migrate == 'true'
    outputs:
      ran: "true"
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Corepack # Ensures the correct version of yarn is used
        run: corepack enable

      - name: Set Up node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Migrate DB
        working-directory: packages/api
        run: yarn prisma migrate deploy

      - name: Seed DB
        working-directory: packages/api
        run: yarn prisma db seed

  build_monorepo:
    name: Build Monorepo
    runs-on: ubuntu-latest
    needs: [setup, db_check, db_migrate]
    if: |
      always() &&
      (needs.db_check.outputs.should_migrate == 'false' || needs.db_migrate.result == 'success')
    environment:
      name: ${{ needs.setup.outputs.environment }}
    env:
      NODE_ENV: production
      TURBO_TOKEN: ${{secrets.TURBO_TOKEN}}
      TURBO_TEAM: ${{secrets.TURBO_TEAM_ID}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable corepack # Ensures the correct version of yarn is used
        run: corepack enable

      - name: Set Up node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        working-directory: packages/api
        run: npx prisma generate

      - name: Build monorepo
        run: yarn build

      - name: Install production dependencies
        run: yarn workspaces focus --production --all

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-build
          path: |
            node_modules/
            packages/

  build_api:
    name: Build API
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.setup.outputs.environment }}
    needs: [setup, build_monorepo]
    if: always() && needs.build_monorepo.result == 'success'
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: monorepo-build
          path: .

      - name: Authenticate GCP
        id: google_auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build image and push to GAR
        run: |
          docker build . -f packages/api/Dockerfile -t ${{ needs.setup.outputs.api_image_name }} 
          echo "${{ steps.google_auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://${{ vars.GCP_REGION }}-docker.pkg.dev
          docker push ${{ needs.setup.outputs.api_image_name }}

  build_app:
    name: Build App
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.setup.outputs.environment }}
    needs: [setup, build_monorepo]
    if: always() && needs.build_monorepo.result == 'success'
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: monorepo-build
          path: .

      - name: Authenticate GCP
        id: google_auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build image and push to GAR
        run: |
          docker build . -f packages/app/Dockerfile -t ${{ needs.setup.outputs.app_image_name }}
          echo "${{ steps.google_auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://${{ vars.GCP_REGION }}-docker.pkg.dev
          docker push ${{ needs.setup.outputs.app_image_name }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [setup, build_api, build_app]
    if: always() && needs.build_api.result == 'success' && needs.build_app.result == 'success'
    environment:
      name: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Authenticate GCP
        id: google_auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy API to Cloudrun
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ vars.CLOUD_RUN_APP_SERVICE_NAME }}
          image: ${{ needs.setup.outputs.api_image_name }}
          region: ${{ vars.GCP_REGION }}
          env_vars: |-
            NCCL_ENVIRONMENT: ${{ vars.NCCL_ENVIRONMENT }}
            NCCL_APP_URL: ${{ vars.NCCL_APP_URL }}
            NCCL_API_URL: ${{ vars.NCCL_API_URL }}
            GCP_CLOUD_STORAGE_BUCKET: ${{ vars.GCP_CLOUD_STORAGE_BUCKET }}
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
            GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
            RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Deploy App to Cloudrun
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ vars.CLOUD_RUN_APP_SERVICE_NAME }}
          image: ${{ needs.setup.outputs.app_image_name }}
          region: ${{ vars.GCP_REGION }}
          env_vars: |-
            NCCL_ENVIRONMENT: ${{ vars.NCCL_ENVIRONMENT }}
            NCCL_APP_URL: ${{ vars.NCCL_APP_URL }}
            NCCL_API_URL: ${{ vars.NCCL_API_URL }}
            GCP_CLOUD_STORAGE_BUCKET: ${{ vars.GCP_CLOUD_STORAGE_BUCKET }}
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
            GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
            RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
