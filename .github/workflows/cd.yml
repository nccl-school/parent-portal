name: CD

on:
  push:
    branches:
      # - stage
      # - main
      - gcp

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'stage' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "Deploying branch: ${{ github.ref_name }}"
          echo "To environment: ${{ github.ref_name == 'main' && 'production' || 'stage' }}"

      - name: Read Node.js Version
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Enable Corepack # Ensures the correct version of yarn is used
        run: corepack enable

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Create .env file
        run: |
          cat <<EOF > ./packages/app/.env
          VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          EOF

      - name: Build Project
        run: yarn build

      - name: Google Cloud - Authenticate
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Google Cloud - Setup
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # - name: Deploy Convex
      #   run: yarn workspace @nccl/parent-portal convex:deploy
      #   env:
      #     CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy App to Google Cloud Run
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          SERVICE_NAME="parent-portal"
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            SERVICE_NAME="parent-portal-stage"
          fi

          gcloud builds submit ./packages/app --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/${SERVICE_NAME}

          gcloud run deploy ${SERVICE_NAME} \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/${SERVICE_NAME} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production"

    # --set-env-vars "API_URL=${{ secrets.API_URL }},SECRET_KEY=${{ secrets.SECRET_KEY }}"
