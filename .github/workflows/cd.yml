name: CD

on:
  push:
    branches:
      - dev
      - feat/db-and-api

jobs:
  db_check:
    name: Check DB
    runs-on: ubuntu-latest
    outputs:
      should_migrate: ${{ steps.db.outputs.should_migrate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch comparison branch
        run: git fetch origin dev

      - id: db
        name: Check if Prisma Migrations Have Changed
        working-directory: packages/api
        run: |
          echo "🔍 Checking for changes to 'prisma/migrations/' between this commit and origin/dev"
          CHANGED_FILES=$(git diff --name-only origin/dev...HEAD)
          echo

          echo "📄 Files changed in commit range:"
          echo "$CHANGED_FILES"
          echo

          if echo "$CHANGED_FILES" | grep '^prisma/migrations/'; then
            echo "✅ Detected changes in 'prisma/migrations/' — running DB migration."
            echo "should_migrate=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No changes to 'prisma/migrations/' — skipping DB migration."
            echo "should_migrate=false" >> $GITHUB_OUTPUT
          fi
  db_migrate:
    name: Migrate DB
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    needs: db_check
    if: needs.db_check.outputs.should_migrate == 'true'
    outputs:
      ran: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Node.js Version
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Enable Corepack # Ensures the correct version of yarn is used
        run: corepack enable

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Prisma Migrate Deploy
        working-directory: packages/api
        run: yarn prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Generate Prisma Client
        working-directory: packages/api
        run: yarn prisma generate

      - name: Seed
        working-directory: packages/api
        run: yarn prisma db seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [db_check, db_migrate]
    if: |
      always() &&
      (needs.db_check.outputs.should_migrate == 'false' || needs.db_migrate.result == 'success')
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    steps:
      - name: Deploy
        run: |
          echo "Deploying branch: ${{ github.ref_name }}"
          echo "To environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Node.js Version
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Enable Corepack # Ensures the correct version of yarn is used
        run: corepack enable

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Generate Prisma Client
        working-directory: packages/api
        run: yarn prisma generate

      - name: Build Monorepo
        run: yarn build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          TURBO_TOKEN: ${{secrets.TURBO_TOKEN}}
          TURBO_TEAM: ${{secrets.TURBO_TEAM_ID}}

      - name: GCP - Authenticate
        id: google_auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: GCP - Setup
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set image names
        id: image_names
        run: |
          echo "IMAGE_NAME_API=gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ vars.CLOUD_RUN_API_SERVICE_NAME }}" >> $GITHUB_ENV
          echo "IMAGE_NAME_APP=gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ vars.CLOUD_RUN_APP_SERVICE_NAME }}" >> $GITHUB_ENV

      - name: Docker Auth
        id: docker-auth
        uses: "docker/login-action@v1"
        with:
          username: "oauth2accesstoken"
          password: "${{ steps.google_auth.outputs.access_token }}"
          registry: "us-east4-docker.pkg.dev"

      - name: API - Docker Build & push to GCR
        uses: docker/build-push-action@v6
        with:
          context: packages/api
          push: true
          tags: "${{ env.IMAGE_NAME_API }}"

      - name: API - Deploy to CloudRun
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          service: "${{ vars.CLOUD_RUN_API_SERVICE_NAME }}"
          image: "${{ env.IMAGE_NAME_API }}"
          project_id: "${{ secrets.GCP_PROJECT_ID }}"
          env_vars: |-
            NCCL_APP_URL=${{ vars.NCCL_APP_URL }}
            NCCL_API_URL=${{ vars.NCCL_API_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
            CLERK_WEBHOOK_SIGNING_SECRET=${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
            GOOGLE_CALENDAR_API_KEY=${{ secrets.GOOGLE_CALENDAR_API_KEY }}
            GOOGLE_CALENDAR_ID_NCCL_PUBLIC=${{ secrets.GOOGLE_CALENDAR_ID_NCCL_PUBLIC }}

