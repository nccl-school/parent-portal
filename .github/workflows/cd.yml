name: CD

# on:
#   push:
#     branches:
#       - dev

on:
  pull_request:
    branches:
      - dev

env:
  # CI
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM_ID: ${{ secrets.TURBO_TEAM_ID }}
  # CD
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_CLOUDRUN_SERVICE_APP: ${{ vars.GCP_CLOUDRUN_SERVICE_APP }}
  GCP_CLOUDRUN_SERVICE_API: ${{ vars.GCP_CLOUDRUN_SERVICE_API }}
  GCP_ARTIFACT_REGISTRY_APP: ${{ vars.GCP_ARTIFACT_REGISTRY_APP }}
  GCP_ARTIFACT_REGISTRY_API: ${{ vars.GCP_ARTIFACT_REGISTRY_API }}
  # Runtime
  NODE_ENV: production
  NCCL_ENVIRONMENT: ${{ vars.NCCL_ENVIRONMENT }}
  NCCL_APP_URL: ${{ vars.NCCL_APP_URL }}
  NCCL_API_URL: ${{ vars.NCCL_API_URL }}
  GCP_CLOUD_STORAGE_BUCKET: ${{ vars.GCP_CLOUD_STORAGE_BUCKET }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}

  SENTRY_PROJECT_APP: ${{ vars.SENTRY_PROJECT_APP }}
  SENTRY_PROJECT_API: ${{ vars.SENTRY_PROJECT_API }}
  SENTRY_DSN_APP: ${{ vars.SENTRY_DSN_APP }}
  SENTRY_DSN_API: ${{ vars.SENTRY_DSN_API }}
  SENTRY_ENABLED: ${{ vars.SENTRY_ENABLED }}
  # Seed
  SUPER_USER_PASSWORD: ${{ secrets.SUPER_USER_PASSWORD }}
  SUPER_USER_EMAIL: ${{ secrets.SUPER_USER_EMAIL }}

jobs:
  setup:
    name: Validate -> Build -> Migrate -> Deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    outputs:
      api_image_name: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY_API }}/${{ vars.GCP_CLOUDRUN_SERVICE_API }}
      app_image_name: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY_APP }}/${{ vars.GCP_CLOUDRUN_SERVICE_APP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set Up node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build monorepo
        run: yarn build
        env:
          TURBO_TOKEN: ${{secrets.TURBO_TOKEN}}
          TURBO_TEAM: ${{secrets.TURBO_TEAM_ID}}

      - name: Validate environment
        run: node scripts/validate.cd.js

      - name: Install production dependencies
        run: yarn workspaces focus --production --all

      - name: Authenticate GCP
        id: google_auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Create images names
        run: |
          echo "API_IMAGE_NAME=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY_API }}/${{ vars.GCP_CLOUDRUN_SERVICE_API }}" >> $GITHUB_ENV
          echo "APP_IMAGE_NAME=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY_APP }}/${{ vars.GCP_CLOUDRUN_SERVICE_APP }}" >> $GITHUB_ENV

      - name: Build [API] image and push to GAR
        run: |
          docker build . -f packages/api/Dockerfile -t "$API_IMAGE_NAME" 
          echo "${{ steps.google_auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://${{ vars.GCP_REGION }}-docker.pkg.dev
          docker push "$API_IMAGE_NAME"

      - name: Build [APP] image and push to GAR
        run: |
          docker build . -f packages/app/Dockerfile -t "$APP_IMAGE_NAME"
          echo "${{ steps.google_auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://${{ vars.GCP_REGION }}-docker.pkg.dev
          docker push "$APP_IMAGE_NAME"

      - name: Migrate DB
        working-directory: packages/api
        run: yarn dlx prisma migrate deploy

      - name: Seed DB
        working-directory: packages/api
        run: yarn dlx prisma db seed

      - name: Deploy [API] to Cloudrun
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ vars.GCP_CLOUDRUN_SERVICE_API }}
          image: ${{ env.API_IMAGE_NAME }}
          region: ${{ vars.GCP_REGION }}
          env_vars: |-
            NCCL_ENVIRONMENT=${{ vars.NCCL_ENVIRONMENT }}
            NCCL_APP_URL=${{ vars.NCCL_APP_URL }}
            NCCL_API_URL=${{ vars.NCCL_API_URL }}
            GCP_CLOUD_STORAGE_BUCKET=${{ vars.GCP_CLOUD_STORAGE_BUCKET }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT_APP=${{ vars.SENTRY_PROJECT_APP }}
            SENTRY_PROJECT_API=${{ vars.SENTRY_PROJECT_API }}
            SENTRY_DSN_APP=${{ vars.SENTRY_DSN_APP }}
            SENTRY_DSN_API=${{ vars.SENTRY_DSN_API }}
            SENTRY_ENABLED=${{ vars.SENTRY_ENABLED }}

      - name: Deploy [APP] to Cloudrun
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ vars.GCP_CLOUDRUN_SERVICE_APP }}
          image: ${{ env.APP_IMAGE_NAME }}
          region: ${{ vars.GCP_REGION }}
          env_vars: |-
            NCCL_ENVIRONMENT=${{ vars.NCCL_ENVIRONMENT }}
            NCCL_APP_URL=${{ vars.NCCL_APP_URL }}
            NCCL_API_URL=${{ vars.NCCL_API_URL }}
            GCP_CLOUD_STORAGE_BUCKET=${{ vars.GCP_CLOUD_STORAGE_BUCKET }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT_APP=${{ vars.SENTRY_PROJECT_APP }}
            SENTRY_PROJECT_API=${{ vars.SENTRY_PROJECT_API }}
            SENTRY_DSN_APP=${{ vars.SENTRY_DSN_APP }}
            SENTRY_DSN_API=${{ vars.SENTRY_DSN_API }}
            SENTRY_ENABLED=${{ vars.SENTRY_ENABLED }}
