      #     GOOGLE_CALENDAR_API_KEY=${{ secrets.GOOGLE_CALENDAR_API_KEY }},\
      #     GOOGLE_CALENDAR_ID_NCCL_PUBLIC=${{ secrets.GOOGLE_CALENDAR_ID_NCCL_PUBLIC }}

      - name: GCP - Build App
        # packages/app has to be run this way
        run: |
          echo "📂 Working directory:"
          \tpwd
          echo "📄 Files before Docker build:"
          ls -alh
          echo "📁 Contents of build/ (if exists):"
          ls -alh build || echo "❌ build/ directory not found"
          echo "📄 server.js:"
          cat server.js || echo "❌ server.js not found"

          echo "Building ${{vars.CLOUD_RUN_APP_SERVICE_NAME}}"
          gcloud builds submit packages/app \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{vars.CLOUD_RUN_APP_SERVICE_NAME}} \

