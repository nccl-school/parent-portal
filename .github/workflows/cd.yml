      #     gcloud builds submit . \
      #       --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{vars.CLOUD_RUN_API_SERVICE_NAME}} \

      # - name: GCP - Deploy to Cloud Run
      #   run: |
      #     echo "Deploying ${{vars.CLOUD_RUN_APP_SERVICE_NAME}} to Google Cloud Run"
      #     gcloud run deploy ${{vars.CLOUD_RUN_APP_SERVICE_NAME}} \
      #       --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{vars.CLOUD_RUN_APP_SERVICE_NAME}} \
      #       --platform managed \
      #       --allow-unauthenticated \
      #       --region us-central1 \
      #       --set-env-vars NODE_ENV=production,\
      #     NCCL_APP_URL=${{ vars.NCCL_APP_URL }},\
