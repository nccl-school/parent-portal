name: CD

on:
  push:
    branches:
      - dev
      - feat/db-and-api
      # - main

jobs:
  db_changes:
    name: DB - Check for new migrations
    runs-on: ubuntu-latest
    outputs:
      db_changed: ${{ steps.db.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - id: db
        name: Check if DB has changed
        run: |
          if git diff --name-only ${{ github.sha }} ${{ github.event.before }} | grep '^prisma/migrations/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
  db_deploy:
    name: DB - Run migrations
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    if: needs.db_changes.outputs.db_changed == 'true'
    outputs:
      ran: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Node.js Version
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Enable Corepack # Ensures the correct version of yarn is used
        run: corepack enable

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Deploy Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: yarn prisma migrate deploy

  build:
    name: Build App and API
    runs-on: ubuntu-latest
    needs: db_deploy
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Node.js Version
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Enable Corepack # Ensures the correct version of yarn is used
        run: corepack enable

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Project
        run: yarn build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          TURBO_TOKEN: ${{secrets.TURBO_TOKEN}}
          TURBO_TEAM: ${{secrets.TURBO_TEAM_ID}}

      - name: Upload Build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            packages/app/build
            packages/api
  deploy-app:
    name: Build and Deploy
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: GCP - Authenticate
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: GCP - Setup
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: GCP - Build using Cloud Build
        run: |
          echo "Building ${{vars.SERVICE_NAME}}"
          gcloud builds submit . \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{vars.SERVICE_NAME}} \

      - name: GCP - Deploy to Cloud Run
        run: |
          echo "Deploying ${{vars.SERVICE_NAME}} to Google Cloud Run"
          gcloud run deploy ${{vars.SERVICE_NAME}} \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{vars.SERVICE_NAME}} \
            --platform managed \
            --allow-unauthenticated \
            --region us-central1 \
            --set-env-vars NODE_ENV=production,\
          NCCL_APP_URL=${{ vars.NCCL_APP_URL }},\
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }},\
          CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }},\
          GOOGLE_CALENDAR_API_KEY=${{ secrets.GOOGLE_CALENDAR_API_KEY }},\
          GOOGLE_CALENDAR_ID_NCCL_PUBLIC=${{ secrets.GOOGLE_CALENDAR_ID_NCCL_PUBLIC }}

