name: CD

on:
  push:
    branches:
      # - stage
      # - main
      - gcp

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'stage' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "Deploying branch: ${{ github.ref_name }}"
          echo "To environment: ${{ github.ref_name == 'main' && 'production' || 'stage' }}"

      - name: Read Node.js Version
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Enable Corepack # Ensures the correct version of yarn is used
        run: corepack enable

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      # - name: Install Dependencies
      #   run: yarn install --immutable

      - name: Create .env file
        run: |
          cat <<EOF > ./packages/app/.env
          VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          EOF

      - name: Set Service Name
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "SERVICE_NAME=parent-portal" >> "$GITHUB_ENV"
          else
            echo "SERVICE_NAME=parent-portal-stage" >> "$GITHUB_ENV"
          fi

      # - name: Build Project
      #   run: yarn build

      - name: GCP - Authenticate
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: GCP - Setup
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: GCP - Build in Cloud Build
        env:
          SERVICE_NAME: ${{env.SERVICE_NAME}}
        run: |
          echo "Building $SERVICE_NAME"
          gcloud builds submit . \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/${SERVICE_NAME} \
            --substitutions=_TURBO_TOKEN="${{secrets.TURBO_TOKEN}}",_TURBO_TEAM_ID="${{secrets.TURBO_TEAM_ID}}",

      - name: GCP - Deploy to Cloud Run
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          echo "Deploying $SERVICE_NAME to Google Cloud Run"
          gcloud run deploy ${SERVICE_NAME} \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/${SERVICE_NAME} \
            --platform managed \
            --region us-central1 \
            --set-env-vars "NODE_ENV=production"
            --set-env-vars "NCCL_APP_URL=${{ secrets.NCCL_APP_URL }}"
            --set-env-vars "CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}"
            --set-env-vars "GOOGLE_CALENDAR_API_KEY=${{ secrets.GOOGLE_CALENDAR_API_KEY }}"
            --set-env-vars "GOOGLE_CALENDAR_ID_NCCL_PUBLIC=${{ secrets.GOOGLE_CALENDAR_ID_NCCL_PUBLIC }}"
