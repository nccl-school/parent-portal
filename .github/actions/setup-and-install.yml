name: "Setup & Install"
description: "Set's up node and prepares the repo for CI & CD"
author: "Drew DeCarme (drew@greenflash.digital)"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set node.js version
      id: node_version
      run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

    - name: Enable corepack # Ensures the correct version of yarn is used
      run: corepack enable

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      run: yarn install --immutable

    - name: Validate Environment Variables
      run: |
        yarn turbo run build --filter @nccl/env
        yarn env:validate

    - name: Generate Prisma client
      working-directory: packages/api
      run: npx prisma generate