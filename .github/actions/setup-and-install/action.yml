name: "Setup & Install"
description: "Set's up node and prepares the repo for CI & CD"
author: "Drew DeCarme (drew@greenflash.digital)"

inputs:
  token:
    description: The Turborepo token used for remote build caching
    required: true
  team:
    description: The Turborepo team used to house the remote build caches
    required: true

runs:
  using: "composite"
  steps:
    - name: Set node.js version
      id: node_version
      shell: bash 
      run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

    - name: Enable corepack # Ensures the correct version of yarn is used
      shell: bash 
      run: corepack enable

    - name: Create .env file
      shell: bash 
      run: touch .env

    - name: Set Up node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'
        cache-dependency-path: yarn.lock

    - name: Install dependencies
      shell: bash 
      run: yarn install --immutable

    