name: "Setup & Install"
description: "Set's up node and prepares the repo for CI & CD"
author: "Drew DeCarme (drew@greenflash.digital)"

runs:
  using: "composite"
  steps:
    - name: Set node.js version
      id: node_version
      shell: bash 
      run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

    - name: Enable corepack # Ensures the correct version of yarn is used
      shell: bash 
      run: corepack enable

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash 
      run: yarn install --immutable

    - name: Validate Environment Variables
      shell: bash
      run: |
        yarn turbo run build --filter @nccl/env
        yarn env:validate
      env:
        TURBO_TOKEN: ${{secrets.TURBO_TOKEN}}
        TURBO_TEAM: ${{secrets.TURBO_TEAM_ID}}

    - name: Generate Prisma client
      working-directory: packages/api
      shell: bash 
      run: npx prisma generate

    - name: Build
      shell: bash 
      run: yarn build
      env:
        TURBO_TOKEN: ${{secrets.TURBO_TOKEN}}
        TURBO_TEAM: ${{secrets.TURBO_TEAM_ID}}

    - name: Install production dependencies
      shell: bash 
      run: yarn workspaces focus --production --all